name: Auto import master (theo lich)

# Tu dong tai PKL moi nhat tu Google Drive roi import vao DB Supabase.
# Khong can double-click IMPORT_ALL.bat tren may nua.
#
# YEU CAU 1 LAN DUY NHAT (neu chua lam): GitHub repo -> Settings ->
#   Secrets and variables -> Actions -> New repository secret:
#       Name : DATABASE_URL
#       Value: noi dung file supabase_new.txt (postgresql://... Session pooler)

on:
  schedule:
    # Gio UTC. Viet Nam = UTC+7. Chay Thu 2 - Thu 7 (1-6), 3 moc trong ngay
    # de du lieu luon moi theo nhip team cap nhat sheet.
    - cron: "30 23 * * 0-5"   # 06:30 VN dau ngay (Chu nhat-Thu 6 UTC = T2-T7 VN)
    - cron: "0 4 * * 1-6"     # 11:00 VN giua trua
    - cron: "0 10 * * 1-6"    # 17:00 VN cuoi ngay
  workflow_dispatch:
    inputs:
      projects:
        description: "Ma du an, cach nhau dau cach (de trong = tat ca)"
        required: false
        default: ""
      force:
        description: "Ep import lai ca file khong doi"
        type: boolean
        default: false

concurrency:
  group: auto-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Khoi phuc state (de bo qua du an khong doi)
        uses: actions/cache@v5
        with:
          path: .auto_import_state.json
          key: auto-import-state-${{ github.run_id }}
          restore-keys: |
            auto-import-state-

      - name: Cai thu vien
        run: pip install --quiet pandas openpyxl pyxlsb xlrd psycopg2-binary

      - name: Chay import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Chua cau hinh secret DATABASE_URL. Vao Settings -> Secrets and variables -> Actions -> New repository secret (Name: DATABASE_URL)."
            exit 1
          fi
          ARGS="${{ inputs.projects }}"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "Chay: python auto_import_master.py $ARGS"
          python -u auto_import_master.py $ARGS
